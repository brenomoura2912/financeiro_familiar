<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Novo E-mail - Gestão Financeira</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl rounded-2xl max-w-sm w-full p-6 text-center space-y-5">
    
    <div class="w-12 h-12 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xl mx-auto">
      ✉️
    </div>

    <div class="space-y-1.5">
      <h1 class="text-lg font-bold">Confirme seu Novo E-mail</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
        Enviamos um código de 6 dígitos para:<br>
        <strong class="text-slate-700 dark:text-slate-200 select-all">{{ novo_email }}</strong>
      </p>
    </div>

    <!-- Mensagens Django -->
    {% if messages %}
      <div class="space-y-2">
        {% for message in messages %}
          <div class="p-2.5 text-xs rounded-xl font-medium {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-950/50 dark:text-rose-300 dark:border-rose-900{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-900{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <input type="text" 
               name="codigo" 
               maxlength="6" 
               required 
               autofocus
               placeholder="000000" 
               class="w-full text-center tracking-[0.4em] font-mono text-2xl py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-sm active:scale-95">
        Confirmar e Atualizar E-mail
      </button>
    </form>

    <div class="pt-2 border-t dark:border-slate-700 flex flex-col gap-2 text-xs">
      <a href="{% url 'reenviar_codigo_novo_email' %}" class="text-indigo-600 dark:text-indigo-400 hover:underline font-semibold">
        Não recebeu? Reenviar código
      </a>
      <a href="{% url 'perfil' %}" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        Cancelar
      </a>
    </div>

  </div>

</body>
</html>
