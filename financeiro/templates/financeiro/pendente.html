<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguardando Aprovação - Gestão Familiar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8 text-center space-y-4">
    <div class="text-5xl animate-bounce">⏳</div>
    <h1 class="text-xl font-bold text-slate-800">Solicitação Enviada!</h1>
    <p class="text-sm text-slate-600 leading-relaxed">
      Seu pedido para acessar as contas de <span class="font-bold text-slate-800">{{ vinculo.familiar.nome }}</span> foi registrado com sucesso.
    </p>
    <div class="p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-xs">
      O Gestor da família precisa aprovar sua entrada. Assim que ele autorizar, você terá acesso imediato aos extratos e lançamentos.
    </div>
    <div class="pt-2">
      <a href="{% url 'logout' %}" class="text-xs text-indigo-600 font-semibold hover:underline">Sair por enquanto</a>
    </div>
  </div>
</body>
</html>
