<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Controle do Idoso</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8 space-y-6">
    <div class="text-center space-y-1">
      <div class="text-4xl">👥</div>
      <h1 class="text-2xl font-bold text-slate-800">Criar Nova Conta</h1>
      <p class="text-sm text-slate-500">Cadastre-se para gerenciar ou acompanhar as despesas</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="text-xs text-rose-500">{{ field.errors.0 }}</span>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow transition">
        Concluir Cadastro
      </button>
    </form>

    <div class="text-center text-xs text-slate-500 border-t pt-4">
      Já tem uma conta? 
      <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline">Fazer login</a>
    </div>
  </div>
</body>
</html>
