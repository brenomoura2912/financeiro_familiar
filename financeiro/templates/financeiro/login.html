<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Controle do Idoso</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8 space-y-6">
    <div class="text-center space-y-1">
      <div class="text-4xl">🛡️</div>
      <h1 class="text-2xl font-bold text-slate-800">Controle Financeiro Familiar</h1>
      <p class="text-sm text-slate-500">Gestão financeira familiar com transparência</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% if form.errors %}
        <div class="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg">
          Usuário ou senha inválidos. Por favor, tente novamente.
        </div>
      {% endif %}

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Usuário</label>
        <input type="text" name="username" required autofocus
               class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Senha</label>
        <input type="password" name="password" required
               class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow transition">
        Entrar na Plataforma
      </button>
    </form>

    <div class="text-center text-xs text-slate-500 border-t pt-4">
      Ainda não tem conta? 
      <a href="{% url 'cadastro' %}" class="text-indigo-600 font-semibold hover:underline">Cadastre-se</a>
    </div>
  </div>
</body>
</html>
