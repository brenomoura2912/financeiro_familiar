<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Código</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-200 dark:border-slate-700">
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white text-center mb-2">Código de Verificação</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-6">Insira o código de 6 dígitos que enviamos para o seu e-mail.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-rose-100 text-rose-700{% else %}bg-emerald-100 text-emerald-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Código de 6 dígitos</label>
                <input type="text" name="codigo" maxlength="6" required placeholder="123456" class="w-full text-center tracking-widest text-xl font-bold px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition">Validar Código</button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'esqueci_senha' %}" class="text-sm text-blue-600 dark:text-blue-400 hover:underline">Solicitar novo código</a>
        </div>
    </div>
</body>
</html>
