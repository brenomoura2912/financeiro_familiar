<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Lançamento - Gestão Financeira</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen p-4 flex items-center justify-center transition-colors duration-200">

  <!-- Botão Flutuante Dark/Light Mode -->
  <button type="button" 
          onclick="alternarTema()" 
          title="Alternar Tema Claro/Escuro"
          class="fixed top-4 right-4 p-2.5 rounded-xl bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-sm transition">
    <span id="icone-sol" class="hidden text-sm">☀️</span>
    <span id="icone-lua" class="hidden text-sm">🌙</span>
  </button>

  <div class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-200 dark:border-slate-700 space-y-5">
    
    <div class="flex justify-between items-center border-b dark:border-slate-700 pb-3">
      <div>
        <h1 class="text-lg font-bold text-slate-800 dark:text-slate-100">Editar Lançamento</h1>
        <p class="text-xs text-slate-400">Atualize os detalhes da transação financeira</p>
      </div>
      <a href="{% url 'index' %}" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold px-3 py-1.5 rounded-lg transition">Voltar</a>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-3.5">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="text-xs text-rose-500">{{ field.errors.0 }}</span>
          {% endif %}
        </div>
      {% endfor %}

      <div class="flex gap-2.5 pt-3 border-t dark:border-slate-700">
        <a href="{% url 'index' %}" class="flex-1 text-center bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-2.5 rounded-xl text-xs transition">
          Cancelar
        </a>
        <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md">
          Salvar Alterações
        </button>
      </div>
    </form>

  </div>

  {{ categorias_json|json_script:"categorias-data" }}

  <script>
    function atualizarIconeTema() {
      const isDark = document.documentElement.classList.contains('dark');
      const sol = document.getElementById('icone-sol');
      const lua = document.getElementById('icone-lua');
      if (sol && lua) {
        if (isDark) {
          sol.classList.remove('hidden');
          lua.classList.add('hidden');
        } else {
          sol.classList.add('hidden');
          lua.classList.remove('hidden');
        }
      }
    }

    function alternarTema() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      atualizarIconeTema();
    }
    atualizarIconeTema();

    document.addEventListener('DOMContentLoaded', () => {
      const selectTipo = document.getElementById('id_tipo_lancamento');
      const selectCategoria = document.getElementById('id_categoria_select');
      const categoriasDataEl = document.getElementById('categorias-data');

      if (selectTipo && selectCategoria && categoriasDataEl) {
        const categorias = JSON.parse(categoriasDataEl.textContent);
        function atualizarCategoriasPorTipo() {
          const tipoEscolhido = selectTipo.value;
          const valorSelecionadoAnterior = selectCategoria.value;
          selectCategoria.innerHTML = '<option value="">---------</option>';
          const filtradas = categorias.filter(cat => cat.tipo === tipoEscolhido);
          filtradas.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.nome;
            if (String(cat.id) === String(valorSelecionadoAnterior)) opt.selected = true;
            selectCategoria.appendChild(opt);
          });
        }
        selectTipo.addEventListener('change', atualizarCategoriasPorTipo);
      }
    });
  </script>
</body>
</html>
